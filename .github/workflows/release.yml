name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Linux x86_64
        - target: x86_64-unknown-linux-gnu
          runner: ubuntu-latest
          archive: openxos-probe-linux-x86_64.tar.gz
          binary: openxos-probe
          platform: Linux x86_64
          artifact_dir: linux-x86_64
        # Linux ARM64
        - target: aarch64-unknown-linux-gnu
          runner: ubuntu-latest
          archive: openxos-probe-linux-aarch64.tar.gz
          binary: openxos-probe
          platform: Linux ARM64
          artifact_dir: linux-aarch64
        # macOS x86_64 (Intel)
        - target: x86_64-apple-darwin
          runner: macos-latest
          archive: openxos-probe-macos-x86_64.tar.gz
          binary: openxos-probe
          platform: macOS Intel
          artifact_dir: macos-x86_64
        # macOS ARM64 (Apple Silicon)
        - target: aarch64-apple-darwin
          runner: macos-latest
          archive: openxos-probe-macos-aarch64.tar.gz
          binary: openxos-probe
          platform: macOS Apple Silicon
          artifact_dir: macos-aarch64
        # Windows x86_64
        - target: x86_64-pc-windows-msvc
          runner: windows-latest
          archive: openxos-probe-windows-x86_64.zip
          binary: openxos-probe.exe
          platform: Windows x86_64
          artifact_dir: windows-x86_64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Linux/macOS
        if: matrix.runner != 'windows-latest'
        run: |
          tar -czf ${{ matrix.archive }} -C target/${{ matrix.target }}/release ${{ matrix.binary }}
          sha256sum ${{ matrix.archive }} > ${{ matrix.archive }}.sha256

      - name: Package Windows
        if: matrix.runner == 'windows-latest'
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/${{ matrix.binary }} -DestinationPath ${{ matrix.archive }}
          sha256sum ${{ matrix.archive }} > ${{ matrix.archive }}.sha256

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_dir }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-binaries
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display artifacts structure
        run: find artifacts -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: openxos-probe ${{ github.ref_name }}
          body: |
            ## openxos-probe v${{ github.ref_name }}

            HTTP reconnaissance & security analysis tool for bug bounty hunters.

            ### Features
            - Technology fingerprinting (200+ signatures)
            - Security analysis (WAF, headers, cookies, TLS)
            - API discovery (WebSocket, GraphQL, OpenAPI)
            - Subdomain takeover detection
            - Continuous monitoring with webhooks

            ### Installation

            **Via Cargo (Recommended)**
            ```bash
            cargo install openxos-probe
            openxos-probe --version
            ```

            **Pre-built Binaries**

            | Platform | Architecture | File |
            |----------|--------------|------|
            | Linux | x86_64 | `openxos-probe-linux-x86_64.tar.gz` |
            | Linux | ARM64 | `openxos-probe-linux-aarch64.tar.gz` |
            | macOS | Intel | `openxos-probe-macos-x86_64.tar.gz` |
            | macOS | Apple Silicon | `openxos-probe-macos-aarch64.tar.gz` |
            | Windows | x86_64 | `openxos-probe-windows-x86_64.zip` |

            ### Quick Start
            ```bash
            # Basic scan
            openxos-probe --input subdomains.txt

            # Fast mode
            openxos-probe --input subdomains.txt --fast

            # With monitoring
            openxos-probe --input subdomains.txt --monitor --interval 60 --webhook https://...
            ```

            ### Links
            - [Repository](https://github.com/Openxosdev/openxos-probe)
            - [Documentation](https://github.com/Openxosdev/openxos-probe#readme)

            ---
            *Copyright (c) 2026-2027 Openxosdev*
          files: |
            artifacts/**/openxos-probe-linux-x86_64.tar.gz
            artifacts/**/openxos-probe-linux-x86_64.tar.gz.sha256
            artifacts/**/openxos-probe-linux-aarch64.tar.gz
            artifacts/**/openxos-probe-linux-aarch64.tar.gz.sha256
            artifacts/**/openxos-probe-macos-x86_64.tar.gz
            artifacts/**/openxos-probe-macos-x86_64.tar.gz.sha256
            artifacts/**/openxos-probe-macos-aarch64.tar.gz
            artifacts/**/openxos-probe-macos-aarch64.tar.gz.sha256
            artifacts/**/openxos-probe-windows-x86_64.zip
            artifacts/**/openxos-probe-windows-x86_64.zip.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
